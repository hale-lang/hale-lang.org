<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
<title id="title">Hale digital lotus</title>
<desc id="desc">A geometric luminous lotus held inside an orbital system.</desc>
<defs>
  <linearGradient id="hale-line" x1="18" y1="22" x2="142" y2="140" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#72e7ff"/>
    <stop offset="0.48" stop-color="#f7fbff"/>
    <stop offset="1" stop-color="#9b7cff"/>
  </linearGradient>
  <radialGradient id="hale-core">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.22" stop-color="#7ae8ff"/>
    <stop offset="0.58" stop-color="#756dff" stop-opacity=".92"/>
    <stop offset="1" stop-color="#756dff" stop-opacity="0"/>
  </radialGradient>
  <filter id="hale-glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3.1" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="hale-soft" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
</defs>
