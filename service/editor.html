<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hale playground</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d1117; color: #e6edf3;
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: .75rem;
    padding: .6rem 1rem; border-bottom: 1px solid #21262d;
  }
  header h1 { font-size: .95rem; margin: 0; font-weight: 600; letter-spacing: .02em; }
  header .sub { color: #8b949e; font-size: .8rem; }
  header .spacer { flex: 1; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: #238636; color: #fff; border: 0;
    padding: .4rem .9rem; border-radius: 6px;
  }
  button.ghost { background: transparent; color: #e6edf3; border: 1px solid #30363d; }
  button:disabled { opacity: .55; cursor: default; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; height: calc(100vh - 49px); background: #21262d; }
  .pane { display: flex; flex-direction: column; min-width: 0; background: #0d1117; }
  .pane .label { padding: .35rem .8rem; color: #8b949e; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid #161b22; }

  /* --- overlay editor: highlighted <pre> behind a transparent textarea --- */
  .editor { position: relative; flex: 1; min-height: 0; }
  .editor > pre, .editor > textarea {
    position: absolute; inset: 0; margin: 0; border: 0; padding: 1rem;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre; tab-size: 4; overflow: auto;
  }
  #hl { pointer-events: none; overflow: hidden; color: #e6edf3; background: #0d1117; }
  #src {
    resize: none; outline: 0; background: transparent; color: #e6edf3;
    caret-color: #e6edf3; z-index: 1;
  }
  .editor.hl-on #src { color: transparent; }
  .editor.hl-on #src::selection { background: #264f78; color: transparent; }

  /* token theme (GitHub-dark adjacent, matches the page) */
  .tk-comment  { color: #8b949e; font-style: italic; }
  .tk-keyword  { color: #ff7b72; }
  .tk-string   { color: #a5d6ff; }
  .tk-number   { color: #79c0ff; }
  .tk-type     { color: #ffa657; }
  .tk-function { color: #d2a8ff; }
  .tk-member   { color: #79c0ff; }
  .tk-constant { color: #79c0ff; }
  .tk-operator { color: #ff7b72; }
  .tk-punct    { color: #e6edf3; }
  .tk-attr     { color: #d2a8ff; }
  .tk-self     { color: #ffa657; }
  .tk-param    { color: #ffa657; }
  .tk-variable { color: #e6edf3; }

  #out {
    flex: 1; margin: 0; padding: 1rem; overflow: auto; white-space: pre-wrap;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #out .err { color: #ff7b72; }
  #out .ok  { color: #3fb950; }
  #out .muted { color: #8b949e; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Hale playground</h1>
  <span class="sub">compiles to WebAssembly &amp; runs in your browser</span>
  <span class="spacer"></span>
  <button id="run">▶ Run</button>
  <button id="share" class="ghost">Share link</button>
</header>
<main>
  <section class="pane">
    <div class="label">scratch.hl</div>
    <div class="editor" id="ed">
      <pre id="hl" aria-hidden="true"></pre>
      <textarea id="src" spellcheck="false" wrap="off"></textarea>
    </div>
  </section>
  <section class="pane">
    <div class="label">output</div>
    <pre id="out"><span class="muted">Press Run to compile and execute.</span></pre>
  </section>
</main>

<script type="module">
const $src = document.getElementById("src");
const $out = document.getElementById("out");
const $run = document.getElementById("run");
const $share = document.getElementById("share");
const $ed = document.getElementById("ed");
const $hl = document.getElementById("hl");

const SAMPLE = `// Hale in one file: the locus is the only primitive — one unit
// of state, concurrency, and memory. Loci never share state;
// they talk over a typed bus the compiler checks (publishing
// to a topic nothing receives is a compile error).

type Reading {
    sensor: String;
    value: Int;
}

locus Producer {
    bus {
        publish "station.readings" of type Reading;
    }

    run() {
        "station.readings" <- Reading { sensor: "thermal", value: 41 };
        "station.readings" <- Reading { sensor: "pressure", value: 0 };
        "station.readings" <- Reading { sensor: "thermal", value: 43 };
    }
}

// Owns the state. Handlers are atomic: one message at a time
// per locus, guaranteed by the runtime — no locks, no races.
locus Station {
    params {
        total: Int = 0;
    }

    bus {
        subscribe "station.readings" as on_reading of type Reading;
    }

    fn on_reading(r: Reading) {
        self.total = self.total + r.value;
        match r.value {
            0 -> println("station: ", r.sensor, " -> flat, total ", self.total),
            v -> println("station: ", r.sensor, " -> ", v, ", total ", self.total),
        }
    }
}

main locus App {
    params {
        station: Station = Station { };
        producer: Producer = Producer { };
    }

    // Placement is a deployment decision, made here — not in
    // the loci. On a native build, uncommenting this gives the
    // producer its own OS thread, and the bus carries each
    // Reading across the thread boundary as a typed message.
    // (This browser build is single-threaded wasm, so here
    // everything runs cooperatively on one scheduler.)
    //
    // placement {
    //     producer: pinned;
    // }

    run() {
        println("app: station + producer up");
    }
}

fn main() {
    App { };
}`;

// --- share via URL hash (no backend): #c=<base64(source)> ---
const enc = (s) => btoa(unescape(encodeURIComponent(s)));
const dec = (s) => decodeURIComponent(escape(atob(s)));

function loadFromHash() {
  const m = location.hash.match(/(?:^#|&)c=([^&]+)/);
  if (m) { try { return dec(m[1]); } catch (e) {} }
  return null;
}

const b64bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

// capture name -> span class (first-segment fallback below)
const TOKEN_CLASS = {
  "comment": "tk-comment",
  "keyword": "tk-keyword",
  "string": "tk-string",
  "number": "tk-number",
  "type": "tk-type",
  "function": "tk-function",
  "constant": "tk-constant",
  "operator": "tk-operator",
  "punctuation": "tk-punct",
  "attribute": "tk-attr",
  "ffi": "tk-attr",
  "form": "tk-attr",
  "locality": "tk-attr",
  "variable": "tk-variable",
  "variable.member": "tk-member",
  "variable.builtin": "tk-self",
  "variable.parameter": "tk-param",
};
const classFor = (name) =>
  TOKEN_CLASS[name] || TOKEN_CLASS[name.split(".")[0]] || null;

let tsParser = null, tsQuery = null;
const escapeHtml = (s) =>
  s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function paint() {
  const src = $src.value;
  if (!tsParser) return;
  const tree = tsParser.parse(src);
  const captures = tsQuery.captures(tree.rootNode)
    .slice()
    .sort((a, b) => a.node.startIndex - b.node.startIndex || b.node.endIndex - a.node.endIndex);
  let html = "", pos = 0;
  for (const c of captures) {
    const s = c.node.startIndex, e = c.node.endIndex;
    if (s < pos || e <= s) continue;
    const cls = classFor(c.name);
    if (!cls) continue;
    if (s > pos) html += escapeHtml(src.slice(pos, s));
    html += '<span class="' + cls + '">' + escapeHtml(src.slice(s, e)) + "</span>";
    pos = e;
  }
  html += escapeHtml(src.slice(pos));
  $hl.innerHTML = html + "\n";  // trailing \n keeps last-line scroll aligned
  tree.delete();
  syncScroll();
}

let paintTimer = 0;
function schedulePaint() {
  clearTimeout(paintTimer);
  paintTimer = setTimeout(paint, 30);
}
function syncScroll() {
  $hl.scrollTop = $src.scrollTop;
  $hl.scrollLeft = $src.scrollLeft;
}

async function initHighlighter() {
  try {
    const jsText = new TextDecoder().decode(b64bytes(WTS_JS_B64));
    const mod = await import(URL.createObjectURL(new Blob([jsText], { type: "text/javascript" })));
    const { Parser, Language, Query } = mod;
    await Parser.init({ wasmBinary: b64bytes(WTS_WASM_B64).buffer });
    const lang = await Language.load(b64bytes(GRAMMAR_B64));
    tsParser = new Parser();
    tsParser.setLanguage(lang);
    tsQuery = new Query(lang, new TextDecoder().decode(b64bytes(HL_QUERY_B64)));
    $ed.classList.add("hl-on");
    paint();
  } catch (e) {
    console.warn("syntax highlighting unavailable:", e);
    tsParser = null;
    $ed.classList.remove("hl-on");
  }
}

$src.addEventListener("input", schedulePaint);
$src.addEventListener("scroll", syncScroll);
$src.addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    document.execCommand("insertText", false, "    ");
  }
});

// --- run a Hale-compiled wasm module in the browser sandbox ---
// (env glue lifted verbatim from the Hale-generated .mjs loader)
async function runWasm(base64, onLog) {
  const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
  let mem = null;
  const u8 = () => new Uint8Array(mem.buffer);
  const dv = () => new DataView(mem.buffer);
  const cstr = (p) => {
    const m = u8(); let e = p >>> 0; while (m[e]) e++;
    return new TextDecoder().decode(m.subarray(p >>> 0, e));
  };
  let buf = "";
  const emit = (s) => { buf += s; let nl; while ((nl = buf.indexOf("\n")) >= 0) { onLog(buf.slice(0, nl)); buf = buf.slice(nl + 1); } };
  const flush = () => { if (buf.length) { onLog(buf); buf = ""; } };
  const align = (o, n) => (o + n - 1) & ~(n - 1);
  const fmtprintf = (fmtPtr, vaPtr) => {
    const fmt = cstr(fmtPtr); const d = dv(); let off = vaPtr >>> 0; let out = "";
    for (let i = 0; i < fmt.length; i++) {
      if (fmt[i] !== "%") { out += fmt[i]; continue; }
      if (fmt[i + 1] === "%") { out += "%"; i++; continue; }
      if (fmt.startsWith("%lld", i)) { off = align(off, 8); out += d.getBigInt64(off, true).toString(); off += 8; i += 3; continue; }
      if (fmt.startsWith("%g", i)) { off = align(off, 8); out += String(d.getFloat64(off, true)); off += 8; i += 1; continue; }
      if (fmt.startsWith("%s", i)) { off = align(off, 4); const sp = d.getUint32(off, true); off += 4; out += cstr(sp); i += 1; continue; }
      out += fmt[i];
    }
    return out;
  };
  const writers = {
    puts: (p) => { emit(cstr(p) + "\n"); return 0; },
    printf: (f, va) => { emit(fmtprintf(f, va)); return 0; },
    fputs: (p) => { emit(cstr(p)); return 0; },
    putchar: (c) => { emit(String.fromCharCode(c & 0xff)); return 0; },
    console_log: (p) => { onLog(cstr(p)); return 0; },
    sin: Math.sin, cos: Math.cos, tan: Math.tan, asin: Math.asin, acos: Math.acos,
    atan: Math.atan, atan2: Math.atan2, sqrt: Math.sqrt, exp: Math.exp, log: Math.log,
    pow: Math.pow, tanh: Math.tanh, floor: Math.floor, ceil: Math.ceil, fabs: Math.abs,
  };
  const mod = await WebAssembly.compile(bytes);
  const env = {};
  for (const im of WebAssembly.Module.imports(mod)) {
    if (im.kind !== "function") continue;
    env[im.name] = writers[im.name] || (() => 0);
  }
  const instance = await WebAssembly.instantiate(mod, { env });
  mem = instance.exports.memory;
  if (instance.exports._hale_start) instance.exports._hale_start();
  else if (instance.exports.main) instance.exports.main(0, 0);
  flush();
}

function setOut(html) { $out.innerHTML = html; }
function appendLine(line) {
  const span = document.createElement("span");
  span.textContent = line + "\n";
  $out.appendChild(span);
  $out.scrollTop = $out.scrollHeight;
}

async function run() {
  $run.disabled = true;
  setOut('<span class="muted">compiling…</span>');
  let res;
  try {
    res = await fetch("/compile", { method: "POST", body: $src.value });
  } catch (e) {
    setOut('<span class="err">network error: ' + String(e) + "</span>");
    $run.disabled = false; return;
  }
  let data;
  try { data = await res.json(); }
  catch (e) { setOut('<span class="err">bad response from compile service</span>'); $run.disabled = false; return; }

  if (!data.ok) {
    setOut('<span class="err"></span>');
    $out.firstChild.textContent = data.error || "compile failed";
    $run.disabled = false; return;
  }
  $out.innerHTML = "";
  try {
    await runWasm(data.wasm, appendLine);
    const done = document.createElement("span");
    done.className = "ok"; done.textContent = "✓ done (" + (data.bytes || 0) + " bytes wasm)";
    $out.appendChild(done);
  } catch (e) {
    const err = document.createElement("span");
    err.className = "err"; err.textContent = "runtime error: " + String(e);
    $out.appendChild(err);
  }
  $run.disabled = false;
}

$run.addEventListener("click", run);
$share.addEventListener("click", async () => {
  location.hash = "c=" + enc($src.value);
  try { await navigator.clipboard.writeText(location.href); $share.textContent = "Copied!"; setTimeout(() => ($share.textContent = "Share link"), 1200); }
  catch (e) { $share.textContent = "Link in URL"; setTimeout(() => ($share.textContent = "Share link"), 1200); }
});

// boot
const shared = loadFromHash();
$src.value = shared != null ? shared : SAMPLE;
initHighlighter();
if (shared != null) run();
</script>
</body>
</html>
