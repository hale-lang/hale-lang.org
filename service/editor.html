<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hale playground</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d1117; color: #e6edf3;
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: .75rem;
    padding: .6rem 1rem; border-bottom: 1px solid #21262d;
  }
  header h1 { font-size: .95rem; margin: 0; font-weight: 600; letter-spacing: .02em; }
  header .sub { color: #8b949e; font-size: .8rem; }
  header .spacer { flex: 1; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: #238636; color: #fff; border: 0;
    padding: .4rem .9rem; border-radius: 6px;
  }
  button.ghost { background: transparent; color: #e6edf3; border: 1px solid #30363d; }
  button:disabled { opacity: .55; cursor: default; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; height: calc(100vh - 49px); background: #21262d; }
  .pane { display: flex; flex-direction: column; min-width: 0; background: #0d1117; }
  .pane .label { padding: .35rem .8rem; color: #8b949e; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid #161b22; }
  textarea {
    flex: 1; resize: none; border: 0; outline: 0; padding: 1rem;
    background: #0d1117; color: #e6edf3; tab-size: 4;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #out {
    flex: 1; margin: 0; padding: 1rem; overflow: auto; white-space: pre-wrap;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #out .err { color: #ff7b72; }
  #out .ok  { color: #3fb950; }
  #out .muted { color: #8b949e; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Hale playground</h1>
  <span class="sub">compiles to WebAssembly &amp; runs in your browser</span>
  <span class="spacer"></span>
  <button id="run">▶ Run</button>
  <button id="share" class="ghost">Share link</button>
</header>
<main>
  <section class="pane">
    <div class="label">scratch.hl</div>
    <textarea id="src" spellcheck="false"></textarea>
  </section>
  <section class="pane">
    <div class="label">output</div>
    <pre id="out"><span class="muted">Press Run to compile and execute.</span></pre>
  </section>
</main>

<script type="module">
const $src = document.getElementById("src");
const $out = document.getElementById("out");
const $run = document.getElementById("run");
const $share = document.getElementById("share");

const SAMPLE = `fn main() {
    println("hello from hale");
    let mut n = 0;
    while n < 3 {
        n = n + 1;
        println("tick ", n);
    }
}`;

// --- share via URL hash (no backend): #c=<base64(source)> ---
const enc = (s) => btoa(unescape(encodeURIComponent(s)));
const dec = (s) => decodeURIComponent(escape(atob(s)));

function loadFromHash() {
  const m = location.hash.match(/(?:^#|&)c=([^&]+)/);
  if (m) { try { return dec(m[1]); } catch (e) {} }
  return null;
}

// --- run a Hale-compiled wasm module in the browser sandbox ---
// (env glue lifted verbatim from the Hale-generated .mjs loader)
async function runWasm(base64, onLog) {
  const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
  let mem = null;
  const u8 = () => new Uint8Array(mem.buffer);
  const dv = () => new DataView(mem.buffer);
  const cstr = (p) => {
    const m = u8(); let e = p >>> 0; while (m[e]) e++;
    return new TextDecoder().decode(m.subarray(p >>> 0, e));
  };
  let buf = "";
  const emit = (s) => { buf += s; let nl; while ((nl = buf.indexOf("\n")) >= 0) { onLog(buf.slice(0, nl)); buf = buf.slice(nl + 1); } };
  const flush = () => { if (buf.length) { onLog(buf); buf = ""; } };
  const align = (o, n) => (o + n - 1) & ~(n - 1);
  const fmtprintf = (fmtPtr, vaPtr) => {
    const fmt = cstr(fmtPtr); const d = dv(); let off = vaPtr >>> 0; let out = "";
    for (let i = 0; i < fmt.length; i++) {
      if (fmt[i] !== "%") { out += fmt[i]; continue; }
      if (fmt[i + 1] === "%") { out += "%"; i++; continue; }
      if (fmt.startsWith("%lld", i)) { off = align(off, 8); out += d.getBigInt64(off, true).toString(); off += 8; i += 3; continue; }
      if (fmt.startsWith("%g", i)) { off = align(off, 8); out += String(d.getFloat64(off, true)); off += 8; i += 1; continue; }
      if (fmt.startsWith("%s", i)) { off = align(off, 4); const sp = d.getUint32(off, true); off += 4; out += cstr(sp); i += 1; continue; }
      out += fmt[i];
    }
    return out;
  };
  const writers = {
    puts: (p) => { emit(cstr(p) + "\n"); return 0; },
    printf: (f, va) => { emit(fmtprintf(f, va)); return 0; },
    fputs: (p) => { emit(cstr(p)); return 0; },
    putchar: (c) => { emit(String.fromCharCode(c & 0xff)); return 0; },
    console_log: (p) => { onLog(cstr(p)); return 0; },
    sin: Math.sin, cos: Math.cos, tan: Math.tan, asin: Math.asin, acos: Math.acos,
    atan: Math.atan, atan2: Math.atan2, sqrt: Math.sqrt, exp: Math.exp, log: Math.log,
    pow: Math.pow, tanh: Math.tanh, floor: Math.floor, ceil: Math.ceil, fabs: Math.abs,
  };
  const mod = await WebAssembly.compile(bytes);
  const env = {};
  for (const im of WebAssembly.Module.imports(mod)) {
    if (im.kind !== "function") continue;
    env[im.name] = writers[im.name] || (() => 0);
  }
  const instance = await WebAssembly.instantiate(mod, { env });
  mem = instance.exports.memory;
  if (instance.exports._hale_start) instance.exports._hale_start();
  else if (instance.exports.main) instance.exports.main(0, 0);
  flush();
}

function setOut(html) { $out.innerHTML = html; }
function appendLine(line) {
  const span = document.createElement("span");
  span.textContent = line + "\n";
  $out.appendChild(span);
  $out.scrollTop = $out.scrollHeight;
}

async function run() {
  $run.disabled = true;
  setOut('<span class="muted">compiling…</span>');
  let res;
  try {
    res = await fetch("/compile", { method: "POST", body: $src.value });
  } catch (e) {
    setOut('<span class="err">network error: ' + String(e) + "</span>");
    $run.disabled = false; return;
  }
  let data;
  try { data = await res.json(); }
  catch (e) { setOut('<span class="err">bad response from compile service</span>'); $run.disabled = false; return; }

  if (!data.ok) {
    setOut('<span class="err"></span>');
    $out.firstChild.textContent = data.error || "compile failed";
    $run.disabled = false; return;
  }
  $out.innerHTML = "";
  try {
    await runWasm(data.wasm, appendLine);
    const done = document.createElement("span");
    done.className = "ok"; done.textContent = "✓ done (" + (data.bytes || 0) + " bytes wasm)";
    $out.appendChild(done);
  } catch (e) {
    const err = document.createElement("span");
    err.className = "err"; err.textContent = "runtime error: " + String(e);
    $out.appendChild(err);
  }
  $run.disabled = false;
}

$run.addEventListener("click", run);
$share.addEventListener("click", async () => {
  location.hash = "c=" + enc($src.value);
  try { await navigator.clipboard.writeText(location.href); $share.textContent = "Copied!"; setTimeout(() => ($share.textContent = "Share link"), 1200); }
  catch (e) { $share.textContent = "Link in URL"; setTimeout(() => ($share.textContent = "Share link"), 1200); }
});

// boot
const shared = loadFromHash();
$src.value = shared != null ? shared : SAMPLE;
if (shared != null) run();
</script>
</body>
</html>
