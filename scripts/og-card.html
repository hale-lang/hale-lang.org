<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Source for public/og.png — the link-preview / GitHub social card.

  Regenerate after editing:
    google-chrome --headless --disable-gpu --hide-scrollbars \
      --screenshot=public/og.png --window-size=1280,640 scripts/og-card.html

  1280x640 is GitHub's social-preview size and a clean 2:1 for OG. The card
  is deliberately plain: mark, name, one sentence, the domain. It has to
  survive being rendered at 320px wide in a chat client.

  GitHub does not read og:image from the site — the repo social preview is
  a manual upload under Settings -> Social preview.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
  /* The site's Dark Technofuturism palette (src/styles/tokens.css):
     obsidian ground, cyan & violet bioluminescent nebula, ice-white ink. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    background:
      radial-gradient(55% 70% at 74% 22%, rgba(0, 229, 255, 0.16), transparent 70%),
      radial-gradient(45% 60% at 18% 88%, rgba(176, 132, 255, 0.14), transparent 70%),
      #03060e;
    color: #eef5ff;
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 110px;
    -webkit-font-smoothing: antialiased;
  }
  .mark { display: flex; align-items: center; gap: 24px; }
  .mark img { width: 92px; height: 92px; flex: none; filter: drop-shadow(0 0 18px rgba(0, 229, 255, 0.45)); }
  .name { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 76px; font-weight: 700; letter-spacing: 0.02em; line-height: 1; }
  .tag {
    margin-top: 40px;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: 64px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #ffffff 0%, #d8f8ff 55%, #00e5ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub { margin-top: 22px; font-size: 30px; line-height: 1.38; color: #9bb0d1; max-width: 34ch; }
  .foot {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 58px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 24px;
    color: #00e5ff;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
  <div class="mark">
    <!-- Resolved relative to this file: scripts/ -> ../public/ -->
    <img src="../public/favicon.svg" alt="" />
    <div class="name">hale</div>
  </div>
  <p class="tag">Less language. More compiler.</p>
  <p class="sub">One language from a five&#8209;line script to a dynamic distributed system.</p>
  <div class="foot">hale-lang.org</div>
</body>
</html>
