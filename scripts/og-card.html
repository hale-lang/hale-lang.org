<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Source for public/og.png — the link-preview / GitHub social card.

  Regenerate after editing:
    google-chrome --headless --disable-gpu --hide-scrollbars \
      --screenshot=public/og.png --window-size=1280,640 scripts/og-card.html

  1280x640 is GitHub's social-preview size and a clean 2:1 for OG. The card
  is deliberately plain: mark, name, one sentence, the domain. It has to
  survive being rendered at 320px wide in a chat client.

  GitHub does not read og:image from the site — the repo social preview is
  a manual upload under Settings -> Social preview.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* The site's dark palette (src/styles/tokens.css): plum-black ground, a
     rose and gold wash, warm ink. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    background:
      radial-gradient(55% 70% at 74% 22%, rgba(255, 143, 165, 0.14), transparent 70%),
      radial-gradient(45% 60% at 18% 88%, rgba(255, 210, 138, 0.1), transparent 70%),
      #131015;
    color: #f1eae0;
    font-family: 'Literata', Georgia, serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 110px;
    -webkit-font-smoothing: antialiased;
  }
  .mark { display: flex; align-items: center; gap: 24px; }
  .mark img { width: 92px; height: 92px; flex: none; }
  .name { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 76px; font-weight: 500; letter-spacing: 0.01em; line-height: 1; }
  .tag { margin-top: 40px; font-size: 64px; font-weight: 500; line-height: 1.08; letter-spacing: -0.02em; }
  .sub { margin-top: 22px; font-size: 30px; line-height: 1.35; color: #b3a89c; max-width: 34ch; }
  .foot {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 58px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 24px;
    color: #ffd28a;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="mark">
    <!-- Resolved relative to this file: scripts/ -> ../public/ -->
    <img src="../public/favicon.svg" alt="" />
    <div class="name">hale</div>
  </div>
  <p class="tag">Less language. More compiler.</p>
  <p class="sub">One language from a five&#8209;line script to a distributed system.</p>
  <div class="foot">hale-lang.org</div>
</body>
</html>
